name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: brew install tesseract
      - run: python -m pip install -r requirements.txt
      # CI=true makes the suite fail if the real asyncvnc, numpy, pillow or Quartz is missing.
      - run: python -m unittest discover -s tests -v
